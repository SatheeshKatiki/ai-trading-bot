# QuantAI Trading Bot — CI Pipeline
# Runs on every push and pull request to main/develop.
# Matrix: Python 3.11 backend tests + Node.js 20 frontend type-check & build.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # Python backend — unit + integration tests
  # ---------------------------------------------------------------------------
  backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: trading-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: trading-system/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install all runtime deps; broker SDKs are optional (commented out)
          pip install -r requirements.txt
          # Install test-only tools
          pip install pytest pytest-asyncio httpx

      - name: Create required runtime directories & seed files
        run: |
          mkdir -p config data logs
          # Seed a minimal settings.json so tests that read config don't crash
          echo '{"active_strategy":"ema_rsi","target_pct":2.5,"stoploss_pct":0.5,"trailing_sl":true}' > config/settings.json
          # Seed last_confidence.json for cold-start test
          echo '{"confidence":0,"status":"CI seed","bias":"NEUTRAL"}' > last_confidence.json

      - name: Lint — check for syntax errors (ruff, fast)
        run: |
          pip install ruff --quiet
          ruff check . --select E9,F8,F4 --ignore F401

      - name: Run backend test suite (offline, using TestClient)
        env:
          # Provide dummy env so broker init doesn't fail
          FYERS_CLIENT_ID: CI_TEST_ID
          FYERS_SECRET_KEY: CI_TEST_KEY
        run: |
          # The suite moved to Testing_Automation_AI_Trading_Bot/python-unit/
          # (see that folder's README). Its conftest.py chdirs back to
          # trading-system/, which is why this step still runs from here.
          #
          # The old -k "not test_bt" exclusion is gone: the five assertion-free
          # scripts that needed a live broker session are no longer collected
          # at all — they now live in ../legacy-manual/ as probe_*.py.
          python -m pytest ../Testing_Automation_AI_Trading_Bot/python-unit -v --tb=short

      - name: Run indicator smoke tests
        run: |
          python - <<'EOF'
          import pandas as pd
          import numpy as np
          from shared.indicators import ema, rsi, macd, atr, adx, dmi, supertrend

          # Build synthetic OHLCV frame
          n = 100
          rng = np.random.default_rng(42)
          close = 23000 + rng.normal(0, 50, n).cumsum()
          df = pd.DataFrame({
              "open":   close - rng.uniform(5, 20, n),
              "high":   close + rng.uniform(5, 30, n),
              "low":    close - rng.uniform(5, 30, n),
              "close":  close,
              "volume": rng.integers(10000, 100000, n).astype(float),
          })

          assert len(ema(df["close"], 9))    == n, "EMA length mismatch"
          assert len(rsi(df["close"], 14))   == n, "RSI length mismatch"
          assert len(atr(df, 14))            == n, "ATR length mismatch"
          adx_s = adx(df, 14);  assert len(adx_s) == n, "ADX length mismatch"
          dmi_d = dmi(df, 14);  assert {"adx","plus_di","minus_di"} <= set(dmi_d.columns), "DMI columns missing"
          st    = supertrend(df, 10, 3.0);  assert "direction" in st.columns, "Supertrend direction missing"
          print("All indicator smoke tests passed.")
          EOF

  # ---------------------------------------------------------------------------
  # Frontend — TypeScript type-check + Next.js build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci --prefer-offline

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build
        env:
          # Dummy env so API route files compile without real secrets
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ---------------------------------------------------------------------------
  # Playwright — UI + API automation (Testing_Automation_AI_Trading_Bot)
  # ---------------------------------------------------------------------------
  automation:
    name: Playwright Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            Testing_Automation_AI_Trading_Bot/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Install suite dependencies
        working-directory: Testing_Automation_AI_Trading_Bot
        run: npm ci --prefer-offline

      - name: Type-check and lint the suite
        working-directory: Testing_Automation_AI_Trading_Bot
        run: |
          npx tsc --noEmit
          npx eslint .

      - name: Install Playwright browsers
        working-directory: Testing_Automation_AI_Trading_Bot
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: Testing_Automation_AI_Trading_Bot
        env:
          # Mocked target: every /api/** call is served from fixtures inside
          # the browser, so this job never needs (and can never reach) the
          # Python backend. ALLOW_MUTATIONS is rejected outright when CI=1.
          TEST_TARGET: mocked
          BACKEND_URL: http://localhost:8000
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            Testing_Automation_AI_Trading_Bot/reports/
            Testing_Automation_AI_Trading_Bot/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Security — detect secrets accidentally committed
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for trufflehog

      - name: TruffleHog OSS — scan for leaked credentials
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          # --only-verified silently drops any match TruffleHog couldn't
          # actively confirm against the provider's live API -- this is
          # exactly why the already-committed .fyers_tokens.json leak was
          # never flagged: TruffleHog has no built-in verifier for Fyers'
          # token format, so it never gets a "verified" result to report,
          # regardless of how real the token is. Dropping the flag restores
          # the default behavior of also reporting unverified-but-pattern-
          # matched candidates, at the cost of some false positives on
          # things that merely look like credentials (test fixtures,
          # sample tokens in docs). No extra_args needed to opt into this.
