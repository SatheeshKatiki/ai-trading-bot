[pytest]
# The application code under test lives outside this directory; see
# _bootstrap.py / conftest.py for how it is put on sys.path.
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -ra

markers =
    slow: takes more than a few seconds (model loading, large fixtures)
    broker: needs a real broker session; excluded from CI

filterwarnings =
    ignore::DeprecationWarning:fyers_apiv3.*
    ignore::DeprecationWarning:fastapi.*
